const mtPct=(a,b)=>b?Math.round(a/b*100):null;
const mtLight=(v,g,y)=>v==null?'':v>=g?'🟢':v>=y?'🟡':'🔴';
const mtDelta=(a,b)=>b==null||a==null?'':a>b?`<small style="color:var(--ok)">▲ 比昨天 +${+(a-b).toFixed(1)}</small>`:a<b?`<small style="color:var(--bad)">▼ 比昨天 ${+(a-b).toFixed(1)}</small>`:'<small>與昨天相同</small>';
function mtLine(T){const W=760,H=220,P=34,n=T.length,mx=Math.max(4,...T.map(x=>Math.max(x.dau,x.new,x.old)));const X=i=>P+(W-P-10)*i/Math.max(1,n-1),Y=v=>H-24-(H-44)*v/mx;
  const L=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${T.map((x,i)=>X(i).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ')}"/>`+T.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x[k]).toFixed(1)}" r="2.6" fill="${c}"><title>${x.d} ${({dau:'活躍',new:'新註冊',old:'老玩家'})[k]} ${x[k]}</title></circle>`).join('');
  const grid=[0,.25,.5,.75,1].map(f=>{const v=Math.round(mx*f);return `<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}</text>`}).join('');
  const lab=T.map((x,i)=>i%5===0||i===n-1?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mut)">${x.d.slice(5)}</text>`:'').join('');
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto">${grid}${lab}${L('dau','#e8702a')}${L('new','#2f7ad8')}${L('old','#2a9a5a')}</svg></div>
  <div class="row" style="gap:14px;font-size:13px"><span><b style="color:#e8702a">━</b> 每日活躍</span><span><b style="color:#2f7ad8">━</b> 新註冊</span><span><b style="color:#2a9a5a">━</b> 老玩家回來</span></div>`}
function mtHB(obj,keys,lab,col,unit){const tot=keys.reduce((a,k)=>a+(obj[k]||0),0)||1,mx=Math.max(1,...keys.map(k=>obj[k]||0));
  return keys.map(k=>`<div class="hb w"><span>${lab[k]||k}</span><i style="width:${(obj[k]||0)/mx*100}%;${col?'background:'+col:''}"></i><b>${obj[k]||0} 人 · ${Math.round((obj[k]||0)/tot*100)}%</b></div>`).join('')}
const mtCell=(v,n,ref)=>{if(v==null)return '<td class="n mut">未到</td>';const p=n?v/n*100:0,a=Math.min(1,p/(ref*2));return `<td class="n" style="background:rgba(42,154,90,${(.08+a*.6).toFixed(2)});${p>=ref?'font-weight:800':''}">${Math.round(p)}%<br><small class="mut">${v}</small></td>`};
V.metrics=async()=>{const R=MT.R=await rpc('admin_metrics',{p_days:MT.days}),K=R.kpi,stick=mtPct(K.dau,K.mau),F=R.funnel,C=R.churn;
  const one=mtPct(C.oneday,C.oneday_n),T=R.trend||[];
  const coh=(R.cohorts||[]).filter(c=>c.n>0),avg=k=>{const v=coh.filter(c=>c.r[k]!=null);const n=v.reduce((a,c)=>a+c.n,0);return n?Math.round(v.reduce((a,c)=>a+c.r[k],0)/n*100):null};
  const A1=avg('1'),A7=avg('7'),A30=avg('30');
  const FS=[['reg','註冊帳號'],['start','開始遊戲(取名、選蛋)'],['tut','完成新手教學'],['ch1','通關第 1 章頭目'],['lv5','守護員 Lv.5'],['lv10','守護員 Lv.10'],['quest','解完每日任務(至少一天)'],['spin','轉過抽獎轉盤'],['d1','隔天有回來']];
  const TUT={0:'剛開始(第一場戰鬥前)',1:'第一場戰鬥',2:'幫萌獸升級',3:'升級後',4:'第二場戰鬥',5:'第一次召喚',6:'查看萌獸',7:'最後幾步',8:'最後幾步'};
  const ts=Object.entries(R.tutstuck||{}).sort((a,b)=>+a[0]-+b[0]),tsm=Math.max(1,...ts.map(x=>x[1]));

  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">📈 玩家數據 <small>不含管理員帳號 · 每次打開即時計算</small></h2>
    <div class="row" style="gap:6px"><span class="mut" style="font-size:13px">分析範圍:最近註冊的</span>${[7,14,30,60].map(d=>`<button class="${MT.days===d?'p':'s'}" data-a="mtd:${d}">${d} 天</button>`).join('')}</div></div></div>
  <div class="kpis">
    <div class="kpi"><small>今日活躍人數</small><b>${K.dau}</b>${mtDelta(K.dau,K.dau_y)}</div>
    <div class="kpi"><small>近 7 天活躍</small><b>${K.wau}</b></div>
    <div class="kpi"><small>近 30 天活躍</small><b>${K.mau}</b></div>
    <div class="kpi"><small>黏著度(今日 ÷ 30 天)${mtLight(stick,20,10)}</small><b>${stick==null?'-':stick+'%'}</b><small>20% 以上算不錯</small></div>
    <div class="kpi"><small>今日新註冊</small><b>${K.new}</b>${mtDelta(K.new,K.new_y)}</div>
    <div class="kpi"><small>現在在線</small><b>${K.online}</b><small>累計註冊 ${K.total}</small></div>
    <div class="kpi"><small>今日平均遊玩 ${mtLight(K.mins,20,10)}</small><b>${K.mins==null?'-':K.mins+' 分'}</b>${K.mins!=null?mtDelta(K.mins,K.mins_y):'<small>更新後開始記錄</small>'}</div>
    <div class="kpi"><small>次日留存 ${mtLight(A1,40,25)}</small><b>${A1==null?'-':A1+'%'}</b><small>40% 以上算不錯</small></div>
    <div class="kpi"><small>第 7 天留存 ${mtLight(A7,15,8)}</small><b>${A7==null?'-':A7+'%'}</b><small>15% 以上算不錯</small></div>
    <div class="kpi"><small>一日遊比例 ${one==null?'':one<=50?'🟢':one<=65?'🟡':'🔴'}</small><b>${one==null?'-':one+'%'}</b><small>註冊後只來 1 天,越低越好</small></div>
  </div>
  <div class="card"><h2>每日趨勢 <small>最近 30 天:新註冊、每日活躍、老玩家(不是當天註冊)回來的人數</small></h2>${mtLine(T)}</div>
  <div class="card"><h2>留存表 <small>某天註冊的玩家,第 N 天還有回來的比例。綠色越深越好;粗體 = 達到參考標準(次日 40%、第 3 天 25%、第 7 天 15%、第 14 天 10%、第 30 天 5%)</small></h2>
    ${coh.length?`<div class="tw"><table><thead><tr><th>註冊日</th><th class="n">人數</th>${['次日','第 2 天','第 3 天','第 7 天','第 14 天','第 30 天'].map(x=>`<th class="n">${x}</th>`).join('')}</tr></thead><tbody>
    ${coh.map(c=>`<tr><td>${c.d}</td><td class="n">${c.n}</td>${mtCell(c.r['1'],c.n,40)}${mtCell(c.r['2'],c.n,30)}${mtCell(c.r['3'],c.n,25)}${mtCell(c.r['7'],c.n,15)}${mtCell(c.r['14'],c.n,10)}${mtCell(c.r['30'],c.n,5)}</tr>`).join('')}
    <tr style="border-top:2px solid var(--line)"><td><b>加權平均</b></td><td class="n">${coh.reduce((a,c)=>a+c.n,0)}</td>${['1','2','3','7','14','30'].map(k=>`<td class="n"><b>${avg(k)==null?'-':avg(k)+'%'}</b></td>`).join('')}</tr></tbody></table></div>`:'<div class="empty">這段期間沒有新註冊</div>'}</div>
  <div class="grid2">
    <div class="card"><h2>累計上線天數 <small>最近 ${MT.days} 天註冊的玩家,總共玩了幾天</small></h2>${mtHB(R.days,['1','2-3','4-7','8-14','15+'],{'1':'只有 1 天','2-3':'2~3 天','4-7':'4~7 天','8-14':'8~14 天','15+':'15 天以上'})}</div>
    <div class="card"><h2>最長連續上線 <small>連續每天都來的最長天數</small></h2>${mtHB(R.streak,['1','2-3','4-7','8-14','15+'],{'1':'1 天','2-3':'2~3 天','4-7':'4~7 天','8-14':'8~14 天','15+':'15 天以上'},'var(--blue)')}</div>
  </div>
  <div class="card"><h2>每天遊玩時間 <small>最近 7 天有記錄的 ${R.mins.n} 位玩家,平均每天玩多久(這次更新後才開始記錄)</small></h2>${R.mins.n?mtHB(R.mins,['<5','5-15','15-30','30-60','60+'],{'<5':'5 分鐘以下','5-15':'5~15 分','15-30':'15~30 分','30-60':'30~60 分','60+':'60 分以上'},'var(--ok)'):'<div class="empty">還沒有資料,玩家更新後開始累積</div>'}</div>
  <div class="card"><h2>新手漏斗 <small>最近 ${MT.days} 天註冊的 ${F.reg} 人,每一步還剩多少。掉最多的那一步最需要改善</small></h2>
    ${FS.map(([k,n],i)=>{const v=F[k]||0,base=k==='d1'?F.d1n:F.reg,p=mtPct(v,base)||0,prev=i?F[FS[i-1][0]]||0:null,drop=prev&&k!=='d1'?Math.round((prev-v)/prev*100):null;
      return `<div class="hb w"><span>${n}</span><i style="width:${p}%;background:${drop!=null&&drop>=40?'var(--bad)':'var(--acc)'}"></i><b>${v} 人 · ${p}%${drop!=null&&drop>0?` <small style="color:${drop>=40?'var(--bad)':'var(--mut)'}">(這步流失 ${drop}%)</small>`:''}</b></div>`}).join('')}
    <p class="mut" style="font-size:12px">「隔天有回來」以註冊滿 1 天的 ${F.d1n} 人計算。紅色 = 這一步流失超過 40%。</p></div>
  <div class="grid2">
    <div class="card"><h2>新手教學卡在哪 <small>已開始但還沒完成教學的玩家</small></h2>${ts.length?ts.map(([k,c])=>`<div class="hb w"><span>步驟 ${k}:${TUT[k]||''}</span><i style="width:${c/tsm*100}%;background:var(--warn)"></i><b>${c} 人</b></div>`).join(''):'<div class="empty">沒有卡關的玩家 🎉</div>'}</div>
    <div class="card"><h2>流失與回流</h2>
      <div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"><div class="kpi warn"><small>沉睡 3~6 天</small><b>${C.sleep3}</b></div><div class="kpi bad"><small>沉睡 7 天以上</small><b>${C.sleep7}</b></div><div class="kpi"><small>近 7 天回流</small><b style="color:var(--ok)">${C.back}</b></div></div>
      <p class="mut" style="font-size:12px">沉睡 = 之前玩過 3 天以上,但已經 N 天沒上線。回流 = 休息 4 天以上後又回來。</p></div>
  </div>
  <div class="card"><h2>沉睡玩家名單 <small>之前玩過 3 天以上、已 3 天以上沒上線(最多 200 人)。勾選後可以寄回歸禮物</small></h2>
    ${C.list.length?`<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th><input type="checkbox" id="mtAll" onchange="document.querySelectorAll('.mtck').forEach(c=>c.checked=this.checked)"></th><th>玩家</th><th class="n">等級</th><th class="n">上線天數</th><th>最後上線</th></tr></thead><tbody>
    ${C.list.map(x=>`<tr><td><input type="checkbox" class="mtck" value="${x.uid}"></td><td><a href="#" data-a="pdet:${x.uid}">${esc(x.n)}</a></td><td class="n">Lv.${x.lv}</td><td class="n">${x.nd}</td><td>${x.last}</td></tr>`).join('')}</tbody></table></div>
    <div class="grid2" style="margin-top:10px"><div class="act"><label>信件標題</label><input id="mtT" value="🎁 好久不見!回歸禮物"></div><div class="act"><label>鑽石</label><input id="mtG" type="number" value="300" min="0"></div></div>
    <div class="act"><label>信件內容</label><input id="mtN" value="守護員好久不見!萌獸們都很想你,送你一份回歸禮物,回來看看新活動吧!"></div>
    <div class="row"><button class="p" data-a="mtmail">寄給勾選的玩家</button></div>`:'<div class="empty">目前沒有沉睡玩家</div>'}</div>
  <div class="card"><h2>活動參與 <small>最近 14 天,每天上線的人裡有幾 % 做了這些事</small></h2><div class="tw"><table><thead><tr><th>日期</th><th class="n">活躍</th><th class="n">簽到</th><th class="n">每日任務全清</th><th class="n">轉盤</th></tr></thead><tbody>
    ${AC.slice().reverse().map(x=>`<tr><td>${x.d.slice(5)}</td><td class="n">${x.dau}</td>${['sign','quest','spin'].map(k=>`<td class="n">${x.dau?Math.round(x[k]/x.dau*100)+'%':'-'} <small class="mut">${x[k]}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h2>怎麼判斷遊戲好不好?</h2><ul style="margin:0;padding-left:20px;line-height:1.8;font-size:14px">
    <li><b>次日留存</b>最重要:低於 25% 通常是新手體驗有問題 → 看「新手漏斗」哪一步掉最多。</li>
    <li><b>第 7 天留存</b>代表中期內容夠不夠:低的話,看「累計上線天數」是不是大多卡在 2~3 天。</li>
    <li><b>黏著度</b>代表玩家是不是每天都想回來:低的話,每日任務、簽到、轉盤的參與率可以參考。</li>
    <li>宣傳那幾天看「每日趨勢」:新註冊有沒有上升、之後的活躍有沒有跟著留下來。</li>

A.mtd=d=>{MT.days=+d;render()};
A.mtmail=async()=>{const ids=[...document.querySelectorAll('.mtck:checked')].map(x=>x.value);if(!ids.length)return toast('請先勾選玩家');const g=Math.round(+$('mtG').value||0),t=$('mtT').value.trim(),n=$('mtN').value.trim();if(!n)return toast('請填寫信件內容');
  if(!sure('mtm'+ids.length+g,`寄給 ${ids.length} 位玩家(每人 💎${g})`))return;try{const r=await rpc('admin_mail_many',{p_uids:ids,p_gem:g,p_note:n,p_title:t||null,p_bonus:null});toast(`已寄出 ${r.sent} 封`)}catch(x){toast(x.message)}};
// ---------- 活動 ----------
const EVK={xp2:'雙倍經驗(萌獸經驗 ×2)',drop2:'雙倍掉落(星星幣、進化石 ×2)',sumup:'召喚機率 UP(傳說 3%、史詩 15%)'};
const dtl=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
V.events=async()=>{const L=await rpc('admin_events'),now=Date.now(),st=e=>new Date(e.starts)>now?'<span class="tag">未開始</span>':new Date(e.ends)>now?'<span class="tag ok">進行中</span>':'<span class="tag">已結束</span>';
  return `<div class="card act"><h2>新增活動 <small>時間到自動開始、自動結束;進行中會顯示在遊戲跑馬燈</small></h2><input type="hidden" id="eid"><label>活動種類</label><select id="ek">${Object.entries(EVK).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select>
    <div class="grid2"><div class="act"><label>開始時間</label><input type="datetime-local" id="es" value="${dtl(Date.now())}"></div><div class="act"><label>結束時間</label><input type="datetime-local" id="ee" value="${dtl(Date.now()+3*864e5)}"></div></div>
    <label>說明(玩家看得到,可空白)</label><input id="en" placeholder="例如:週末限定"><div class="row"><button class="p" data-a="esave">儲存活動</button></div></div>
  <div class="card"><h2>活動列表</h2><div class="tw"><table><thead><tr><th>活動</th><th>開始</th><th>結束</th><th>狀態</th><th></th></tr></thead><tbody>${L.map(e=>`<tr><td><b>${EVK[e.kind]||e.kind}</b>${e.note?'<br><small class="mut">'+esc(e.note)+'</small>':''}</td><td>${tm(e.starts)}</td><td>${tm(e.ends)}</td><td>${st(e)}</td><td><button class="s" data-a="eend:${e.id}">${new Date(e.ends)>now?'立即結束':''}</button> <button class="s d" data-a="edel:${e.id}">刪除</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">還沒有活動</td></tr>'}</tbody></table></div></div>`};
A.esave=async()=>{const s=new Date($('es').value),e=new Date($('ee').value);if(isNaN(s)||isNaN(e))return toast('請填寫時間');try{await rpc('admin_event_save',{p_id:null,p_kind:$('ek').value,p_starts:s.toISOString(),p_ends:e.toISOString(),p_note:$('en').value.trim()||null});toast('活動已儲存');render()}catch(x){toast(x.message)}};
A.eend=async id=>{const L=await rpc('admin_events'),e=L.find(x=>x.id===+id);if(!e||new Date(e.ends)<=Date.now())return;if(!sure('ee'+id,'立即結束活動'))return;try{await rpc('admin_event_save',{p_id:e.id,p_kind:e.kind,p_starts:new Date(Math.min(new Date(e.starts),Date.now()-1000)).toISOString(),p_ends:new Date().toISOString(),p_note:e.note});render()}catch(x){toast(x.message)}};
A.edel=async id=>{if(!sure('ed'+id,'刪除活動'))return;try{await rpc('admin_event_delete',{p_id:+id});render()}catch(x){toast(x.message)}};

V.codes=async()=>{const L=await rpc('admin_codes');const rw=r=>[r.gem?'💎'+fmt(r.gem):'',r.coin?'⭐'+fmt(r.coin):'',r.candy?'🍬'+r.candy:'',r.stones?'💠'+r.stones:'',r.rtix?'稀有召喚券 ×'+r.rtix:''].filter(Boolean).join('、')||'-';

    <div class="row"><button class="p" data-a="csave">建立</button></div></div>

const CFG_SHOP=[['coin','星星幣袋',100,2],['fruit','經驗糖果包',60,null],['stone','進化石 ×5',120,null],['sta','體力藥水',80,3],['att','攻打令',80,3],['egg','稀有召喚券',400,null],['enh','強化石 ×10',80,3],['reroll','洗練石 ×3',100,2],['eqbox','精選裝備箱(每週)',300,1]];

let CFG=null,CFGD=null;const cfgClone=o=>JSON.parse(JSON.stringify(o||{}));
async function cfgLoad(force){if(!CFG||force){CFG=await rpc('admin_cfg_get');CFGD=cfgClone((CFG.cur||{}).d)}return CFG}
const cv=(sec,k)=>CFGD[sec]&&CFGD[sec][k]!=null?CFGD[sec][k]:undefined;
function cfgField(sec,[k,lab,def,mn,mx,st]){const v=cv(sec,k),ch=v!==undefined&&v!==def;
  if(typeof def==='boolean')return `<label class="cfr ${ch?'chg':''}"><span>${lab}<small>預設:${def?'開':'關'}</small></span><span><input type="checkbox" data-cf="${sec}.${k}" ${(v??def)?'checked':''}> ${(v??def)?'開':'關'}</span></label>`;
  return `<label class="cfr ${ch?'chg':''}"><span>${lab}<small>預設:${def}${mn!=null?` · 範圍 ${mn}~${mx}`:''}</small></span><input type="number" data-cf="${sec}.${k}" data-def="${def}" min="${mn}" max="${mx}" step="${st||1}" value="${v??def}"></label>`}
function cfgSec(sec){const S=CFGF[sec];return `<div class="card act"><h2>${S.t} <button class="s" data-a="cfgDef:${sec}">這區恢復預設</button></h2><div class="cfg">${S.f.map(f=>cfgField(sec,f)).join('')}</div></div>`}
function cfgBar(extra){return `<div class="card cfgbar"><div class="row"><span class="mut" style="flex:1">目前版本:第 ${(CFG.cur||{}).ver||0} 版${(CFG.cur||{}).at?' · '+tm(CFG.cur.at):''}。黃色底 = 跟預設不同。改完按「檢查並儲存」,玩家約 1 分鐘內套用。</span><button class="p" data-a="cfgSave">檢查並儲存</button></div>${extra||''}</div>`}
function cfgRead(){document.querySelectorAll('[data-cf]').forEach(i=>{const [sec,...kk]=i.dataset.cf.split('.'),k=kk.join('.');let v;
  if(i.type==='checkbox')v=i.checked;else{if(i.value==='')return;v=+i.value}
  const path=[sec,...kk];let o=CFGD;for(let j=0;j<path.length-1;j++){o[path[j]]=o[path[j]]||{};o=o[path[j]]}o[path[path.length-1]]=v})}
function cfgDefOf(path){const [sec,a,b]=path;if(CFGF[sec]){const f=CFGF[sec].f.find(x=>x[0]===a);return f?f[2]:undefined}
  if(sec==='shop'){const r=CFG_SHOP.find(x=>x[0]===a);return r?{cost:r[2],lim:r[3],on:true}[b]:undefined}
  if(sec==='pay'){const r=CFG_PAY.find(x=>x[0]===a);return r?{nt:r[1],g:r[2],b:r[3],on:true}[b]:undefined}
  if(sec==='unlock'){const r=CFG_UL.find(x=>x[0]===a);return r?r[2]:undefined}}
function cfgClean(d){const o=cfgClone(d);const walk=(x,path)=>{for(const k of Object.keys(x)){const p=[...path,k];if(x[k]&&typeof x[k]==='object'){walk(x[k],p);if(!Object.keys(x[k]).length)delete x[k]}else{const df=cfgDefOf(p);if(df!==undefined&&(x[k]===df||(df===null&&(x[k]===0||x[k]===''))))delete x[k]}}};walk(o,[]);return o}
function cfgLab(path){const [sec,a,b]=path;if(CFGF[sec]){const f=CFGF[sec].f.find(x=>x[0]===a);return CFGF[sec].t+' › '+(f?f[1]:a)}
  if(sec==='shop')return '商店 › '+((CFG_SHOP.find(x=>x[0]===a)||[])[1]||a)+' › '+({cost:'價格',lim:'每日限購',on:'上架'}[b]||b);
  if(sec==='pay')return '儲值 › NT$'+((CFG_PAY.find(x=>x[0]===a)||[])[1]||a)+' 方案 › '+({nt:'售價',g:'鑽石',b:'加贈',on:'販售'}[b]||b);
  if(sec==='unlock')return '解鎖等級 › '+((CFG_UL.find(x=>x[0]===a)||[])[1]||a);return path.join(' › ')}
function cfgDiff(a,b){const out=[],flat=(x,p,m)=>{for(const k in x||{}){const q=[...p,k];if(x[k]&&typeof x[k]==='object')flat(x[k],q,m);else m[q.join('.')]=x[k]}return m};const A2=flat(a,[],{}),B2=flat(b,[],{});
  for(const k of new Set([...Object.keys(A2),...Object.keys(B2)])){if(A2[k]!==B2[k]){const p=k.split('.'),df=cfgDefOf(p);out.push({lab:cfgLab(p),from:A2[k]??df??'預設',to:B2[k]??df??'預設'})}}return out}
function cfgCheck(d){const e=[],S=d.summon||{},g=(k,df)=>S[k]??df;if(g('r3',1.5)+g('r2',8.5)+g('r1',30)>100)e.push('一般召喚:傳說+史詩+稀有機率加總不能超過 100%');if(g('up3',3)+g('up2',12)+g('r1',30)>100)e.push('UP 活動:傳說+史詩+稀有機率加總不能超過 100%');
  document.querySelectorAll('[data-cf][type=number]').forEach(i=>{const v=+i.value;if(i.value!==''&&((i.min!==''&&v<+i.min)||(i.max!==''&&v>+i.max)))e.push(`「${cfgLab(i.dataset.cf.split('.'))}」超出範圍 ${i.min}~${i.max}`)});return e}

V.dm=async()=>{const L=(await dmBadge())||[];let C=null;if(DMU){try{C=await rpc('admin_dm_get',{p_uid:DMU})}catch(e){toast(e.message)}}
  const list=L.map(t=>`<button class="${t.uid===DMU?'on':''}" data-a="dmo:${t.uid}"><b>${t.winner?'🏆 ':''}${esc(t.pname||'玩家')} <span class="mut" style="font-weight:400">${esc(t.acct||'')}</span></b><span>${t.unread?`<span class="dmn">${t.unread}</span>`:`<small class="mut">${ago(t.last_at)}</small>`}</span><small>${t.last_adm?'你:':''}${esc(t.last||'')}</small></button>`).join('')||'<div class="empty">還沒有對話</div>';
  const find=`<div class="row"><input id="dmq" placeholder="暱稱 / 帳號 / 好友碼" value="${esc(DMQ)}"><button class="s" data-a="dmfind">找玩家</button></div>${DMF?`<div class="dml" style="margin:6px 0 10px">${DMF.map(x=>`<button data-a="dmo:${x.uid}"><b>${esc(x.pname||'玩家')} <span class="mut" style="font-weight:400">${esc(x.acct||'訪客')}</span></b><small class="mut">${esc(x.fc||'')}</small></button>`).join('')||'<div class="empty">找不到玩家</div>'}</div>`:''}`;
  const chat=C?`<div class="card"><h2><a href="#" data-a="pdet:${C.uid}">${esc(C.pname||'玩家')}</a> <small>${esc(C.acct||'訪客')}${C.fc?' · 好友碼 '+esc(C.fc):''}${C.win?' · 🏆 '+esc(C.win.serial||'')+' '+(RFS[C.win.status]||C.win.status):''} · 最後上線 ${ago(C.seen)}</small></h2>
    <div class="dmc" id="dmc">${C.msgs.map(m=>`<div class="dmb ${m.adm?'me':''}">${esc(m.body)}<small>${tm(m.at)}${m.adm?(m.rd?' · 已讀':' · 未讀'):''}</small></div>`).join('')||'<div class="empty">還沒有訊息,傳第一則吧。玩家會在遊戲裡收到通知,並可以回覆你。</div>'}</div>
    <div class="dmin"><textarea id="dmt" maxlength="1000" placeholder="輸入訊息(Ctrl+Enter 送出)"></textarea><button class="p" data-a="dmsend">送出</button></div>
    <p class="mut" style="margin:6px 0 0">⚠ 請勿在私訊要求玩家提供密碼。領獎資料(姓名、手機、帳戶)請玩家在遊戲內的領獎表單填寫。</p></div>`:'<div class="card empty">從左邊選一位玩家,或用暱稱 / 好友碼找玩家開始私訊</div>';
  setTimeout(()=>{const c=$('dmc');if(c)c.scrollTop=c.scrollHeight;const t=$('dmt');if(t)t.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();A.dmsend()}};const q=$('dmq');if(q)q.onkeydown=e=>{if(e.key==='Enter')A.dmfind()}},0);
  return `<div class="dmw"><div class="card"><h2>💬 私訊 <small>玩家只能回覆你,不能私訊其他玩家</small></h2>${find}<div class="dml">${list}</div></div><div>${chat}</div></div>`};
A.dmo=async(uid,quiet)=>{DMU=uid;if(quiet){try{const C=await rpc('admin_dm_get',{p_uid:uid});const c=$('dmc');if(c&&TAB==='dm'&&DMU===uid){const at=c.scrollHeight-c.scrollTop-c.clientHeight<40;c.innerHTML=C.msgs.map(m=>`<div class="dmb ${m.adm?'me':''}">${esc(m.body)}<small>${tm(m.at)}${m.adm?(m.rd?' · 已讀':' · 未讀'):''}</small></div>`).join('');if(at)c.scrollTop=c.scrollHeight}}catch(e){}return}render()};
A.dmgo=uid=>{DMU=uid;$('drawer').hidden=true;if(TAB!=='dm'){TAB='dm';location.hash='dm'}render()};
A.dmfind=async()=>{DMQ=(($('dmq')||{}).value||'').trim();if(!DMQ){DMF=null;return render()}try{DMF=await rpc('admin_dm_find',{p_q:DMQ})}catch(e){toast(e.message);DMF=[]}render()};
A.dmsend=async()=>{const t=$('dmt'),b=(t&&t.value||'').trim();if(!b)return toast('請輸入訊息');if(A.dmsend.busy)return;A.dmsend.busy=1;try{await rpc('admin_dm_send',{p_uid:DMU,p_body:b});t.value='';toast('已送出');render()}catch(e){toast(e.message)}A.dmsend.busy=0};
// ---------- 系統 ----------
V.system=async()=>{let q={online:0,queue:0,max:0};try{q=await rpc('admin_queue')}catch(e){}return `<div class="card act"><h2>🚦 同時在線上限(排隊入場)</h2><p>目前在線 <b>${q.online}</b> 人 · 排隊中 <b>${q.queue}</b> 人 · 上限 <b>${q.max||'不限制'}</b></p><label>同時在線上限(0 = 不限制;Supabase 免費版建議 200)</label><input id="qmax" type="number" value="${q.max||0}"><div class="row"><button class="p" data-a="qset">儲存</button></div><p class="mut">超過上限時,新登入的玩家會看到「伺服器擁塞中」並自動排隊;已在遊戲裡的玩家不受影響,管理員帳號不用排隊。</p></div>`+await V.system0()};
V.system0=async()=>{const {data}=await sb.from('settings').select('v').eq('k','maint').maybeSingle(),m=(data&&data.v)||{};return `<div class="card act" style="${m.on?'border-color:var(--bad)':''}"><h2>🛠 維護模式 ${m.on?'<span class="tag bad">維護中</span>':'<span class="tag ok">正常營運</span>'}</h2><p class="mut" style="margin:0">開啟後一般玩家打開遊戲只會看到維護畫面,所有伺服器功能暫停;管理員帳號仍然可以進遊戲測試。</p>
  <label>維護訊息(玩家看得到)</label><input id="mm" value="${esc(m.msg||'')}" placeholder="例如:預計 15:00 完成維護,完成後會寄送補償!"><div class="row">${m.on?'<button class="p" data-a="maint:0">結束維護</button>':'<button class="d" data-a="maint:1">開始維護</button>'}</div></div>`};
A.maint=async on=>{if(on==='1'&&!sure('maint','開始維護,玩家將無法進入遊戲'))return;try{await rpc('admin_maint',{p_on:on==='1',p_msg:$('mm').value.trim()});toast(on==='1'?'已開始維護':'已結束維護');render()}catch(e){toast(e.message)}};
// ---------- 交易所 ----------
V.market=async()=>{const L=await rpc('admin_market',{p_status:MKS});return `<div class="card"><div class="row">${[['open','上架中'],['sold','已成交'],['cancelled','已下架'],['expired','已過期'],['all','全部']].map(([k,n])=>`<button class="s ${MKS===k?'p':''}" data-a="mks:${k}">${n}</button>`).join('')}</div></div>
  <div class="card"><h2>交易所 <small>最近 100 筆 · 價格明顯高於參考價會標示</small></h2><div class="tw"><table><thead><tr><th>時間</th><th>裝備</th><th>副屬性</th><th class="n">價格</th><th class="n">參考價</th><th>賣家</th><th>狀態</th><th></th></tr></thead><tbody>
  ${L.map(m=>{const r=m.price/Math.max(1,m.fair);return `<tr><td class="mut">${tm(m.created)}</td><td>${itemName(m.item)}</td><td class="mut">${esc(itemSubs(m.item))}</td><td class="n">💎${fmt(m.price)}${r>1.6?' <span class="tag warn">偏高</span>':''}</td><td class="n mut">${fmt(m.fair)}</td><td><a href="#" data-a="pdet:${m.seller}">${esc(m.seller_name||'守護員')}</a></td><td>${{open:'上架中',sold:m.buyer?'玩家買走':'系統買走',cancelled:'已下架',expired:'已過期'}[m.status]||m.status}</td><td>${m.status==='open'?`<button class="s d" data-a="mkrm:${m.id}">下架</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">沒有資料</td></tr>'}</tbody></table></div></div>`};
A.mks=k=>{MKS=k;render()};
A.mkrm=async id=>{if(!sure('mk'+id,'下架這件裝備並退回賣家'))return;try{await rpc('admin_market_remove',{p_id:+id,p_reason:'違反交易規範'});toast('已下架');render()}catch(e){toast(e.message)}};
// ---------- 管理員 ----------
V.admins=async()=>{const L=await rpc('admin_admins');let C={};try{C=await rpc('admin_caps_get')}catch(e){}const KN={gem:'💎 鑽石',coin:'⭐ 星星幣',candy:'🍬 糖果',stones:'💠 進化石',ore:'🔩 礦石',enh:'🔨 強化石',reroll:'🔄 洗練石',rtix:'🎟 抽獎券'};
  return `<div class="card act"><h2>新增管理員 <small>對方要先在遊戲裡建立帳號密碼;新增後預設是「客服」,再到下面調整權限</small></h2><div class="row"><input id="aa" placeholder="對方的遊戲帳號" autocapitalize="off"><button class="p" data-a="aadd">新增</button></div></div>
  <div class="card"><h2>管理員</h2><div class="tw"><table><thead><tr><th>帳號</th><th>權限</th><th>加入時間</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td><b>${esc(x.acct)}</b>${x.uid===ME.uid?' <span class="tag">你</span>':''}</td><td>${x.uid===ME.uid?RNM[x.role||'super']:`<select data-rl="${x.uid}">${['super','ops','cs'].map(r=>`<option value="${r}" ${r===(x.role||'super')?'selected':''}>${RNM[r]}</option>`).join('')}</select>`}</td><td class="mut">${tm(x.added)}</td><td>${x.uid===ME.uid?'':`<button class="s d" data-a="arm:${esc(x.acct)}">移除</button>`}</td></tr>`).join('')}</tbody></table></div>
  <details style="margin-top:10px"><summary>各權限能做什麼</summary><div class="tw"><table><thead><tr><th>功能</th><th>超級管理員</th><th>營運</th><th>客服</th></tr></thead><tbody>${[['看數據、玩家資料、回客服、私訊、聊天管理(含禁言)','✅','✅','✅'],['寄信補償','✅','✅(有上限)','✅(有上限)'],['寄給所有玩家、直接調整鑽石','✅','✅(有上限)','❌'],['公告、廣播、活動、兌換碼、抽獎、團隊 Boss 測試','✅','✅','❌'],['停權、修改玩家資料、還原存檔、電腦玩家','✅','✅','❌'],['遊戲數值設定、儲值紀錄','✅','❌','❌'],['維護模式、排隊、備份','✅','❌','❌'],['管理員與權限、補償上限','✅','❌','❌'],['操作紀錄','全部','只看自己','只看自己']].map(r=>`<tr>${r.map((c,i)=>`<td${i?' style="text-align:center"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>
  <div class="card act" id="capCard"><h2>補償上限 <small>營運和客服「每次」寄信或調整鑽石的最高數量;超級管理員不受限</small></h2><div class="tw"><table><thead><tr><th>項目</th><th>🛠 營運</th><th>💬 客服</th></tr></thead><tbody>${Object.keys(KN).map(k=>`<tr><td>${KN[k]}</td>${['ops','cs'].map(r=>`<td><input type="number" min="0" data-cap="${r}:${k}" value="${(C[r]||{})[k]??0}" style="width:120px"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="row"><button class="p" data-a="capSave">儲存上限</button></div></div>`};
A.capSave=async()=>{const o={ops:{},cs:{}};document.querySelectorAll('[data-cap]').forEach(i=>{const [r,k]=i.dataset.cap.split(':');o[r][k]=Math.max(0,+i.value||0)});try{await rpc('admin_caps_set',{p:o});toast('補償上限已儲存')}catch(e){toast(e.message)}};
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset||!t.dataset.rl)return;try{await rpc('admin_admin_role',{p_uid:t.dataset.rl,p_role:t.value});toast('權限已更新:'+RNM[t.value])}catch(er){toast(er.message);render()}});
A.aadd=async()=>{const a=$('aa').value.trim();if(!a)return toast('請輸入帳號');try{await rpc('admin_admin_set',{p_acct:a,p_add:true});toast('已新增管理員');render()}catch(e){toast(e.message)}};
A.arm=async a=>{if(!sure('arm'+a,'移除管理員 '+a))return;try{await rpc('admin_admin_set',{p_acct:a,p_add:false});toast('已移除');render()}catch(e){toast(e.message)}};
// ---------- 紀錄 ----------
V.logs=async()=>{const L=await rpc('admin_logs',{p_limit:200});const det=l=>{const d=l.detail||{};return l.action==='gem'?`${d.delta>0?'+':''}${fmt(d.delta)} 💎 · ${esc(d.reason||'')}`:l.action==='mail'?`${d.gem?'💎'+fmt(d.gem)+' · ':''}${d.bonus?BONT(d.bonus)+' · ':''}${esc(d.note||'')}${d.n>1?' · 共 '+fmt(d.n)+' 封':''}`:l.action==='ban'?`${esc(d.reason||'')} · ${d.hours?d.hours+' 小時':'永久'}`:l.action==='bot'||l.action==='bot_delete'?esc(d.name||''):l.action==='bot_reset'?(d.id?'#'+d.id:'全部')+' · '+fmt(d.n)+' 位':l.action==='notice'?esc(d.title||'')+(d.mail?' · 寄給 '+fmt(d.mail)+' 人':''):l.action==='live'?esc(d.txt||''):l.action==='maint'?(d.on?'開始':'結束')+(d.msg?' · '+esc(d.msg):''):l.action==='code'?esc(d.code||''):l.action==='mute'?(d.hours?d.hours+' 小時':'永久')+' · '+esc(d.reason||''):l.action==='ticket'?esc(d.reply||''):l.action==='event'?esc(d.kind||''):l.action==='set:pts'?'設為 '+fmt(d.val):l.action==='market_remove'?'#'+d.id:''};
  return `<div class="card"><h2>操作紀錄 <small>每位管理員做過的事都會留下紀錄</small></h2><div class="tw"><table><thead><tr><th>時間</th><th>管理員</th><th>動作</th><th>對象</th><th>內容</th></tr></thead><tbody>${L.map(l=>`<tr><td class="mut">${tm(l.at)}</td><td>${esc(l.admin)}</td><td>${ACTN[l.action]||esc(l.action)}</td><td>${l.target?`<a href="#" data-a="pdet:${l.target}">${esc(l.tname||'玩家')}</a>`:(l.action==='mail'?'全服':'-')}</td><td>${det(l)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">還沒有紀錄</td></tr>'}</tbody></table></div></div>`};
boot();
</script></body></html>
